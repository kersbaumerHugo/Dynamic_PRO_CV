<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Hugo Kersbaumer Knupp - Python Engineer</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --primary-light: #34d399;
            --secondary: #14532d;
            --bg-dark: #0f172a;
            --bg-card: #1e293b;
            --text-light: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #22d3ee;
        }
      * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
      body {
            font-family: 'Inter', 'Segoe UI', system-ui, sans-serif;
            background: var(--bg-dark);
            color: var(--text-light);
            line-height: 1.6;
            padding: 20px;
        }
      .container {
            max-width: 1000px;
            margin: 0 auto;
        }
      /* Header com foto */
        .header {
            background: linear-gradient(135deg, var(--secondary) 0%, var(--bg-card) 100%);
            border-radius: 16px;
            padding: 50px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.2);
            position: relative;
            overflow: hidden;
        }
      .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--accent));
        }
      .header-content {
            display: flex;
            align-items: center;
            gap: 40px;
        }
      .photo-container {
            flex-shrink: 0;
        }
      .photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 4px solid var(--primary);
            object-fit: cover;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3em;
        }
      .header-info {
            flex: 1;
        }
      .header h1 {
            font-size: 2.5em;
            margin-bottom: 8px;
            background: linear-gradient(135deg, var(--primary-light), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
      .subtitle {
            font-size: 1.2em;
            color: var(--text-muted);
            margin-bottom: 20px;
        }
      .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }
      .contact-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-muted);
            font-size: 0.95em;
        }
      .contact-item a {
            color: var(--primary-light);
            text-decoration: none;
            transition: color 0.3s;
        }
      .contact-item a:hover {
            color: var(--accent);
        }
      /* Grid de seções */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 30px;
        }
      .section {
            background: var(--bg-card);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(16, 185, 129, 0.1);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.3);
        }
      .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: var(--primary-light);
            display: flex;
            align-items: center;
            gap: 10px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--primary);
        }
      .section-icon {
            font-size: 1.2em;
        }
      /* Timeline para experiência */
        .timeline-item {
            position: relative;
            padding-left: 30px;
            margin-bottom: 30px;
            border-left: 2px solid var(--primary);
        }
      .timeline-item::before {
            content: '';
            position: absolute;
            left: -6px;
            top: 5px;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 4px var(--bg-card);
        }
      .item-header {
            margin-bottom: 12px;
        }
      .item-title {
            font-size: 1.2em;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 4px;
        }
      .item-company {
            color: var(--text-light);
            font-weight: 500;
        }
      .item-date {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-top: 4px;
        }
      .item-description {
            color: var(--text-muted);
            margin-top: 10px;
        }
      .item-description li {
            margin-left: 20px;
            margin-bottom: 8px;
            position: relative;
        }
      .item-description li::marker {
            color: var(--primary);
        }
      /* Skills com ícones */
        .skills-grid {
            display: grid;
            gap: 12px;
        }
      .skill-item {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
        }
      .skill-item:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: var(--primary);
            transform: translateX(4px);
        }
      .skill-icon {
            font-size: 1.5em;
            width: 40px;
            text-align: center;
        }
      .skill-info {
            flex: 1;
        }
      .skill-name {
            font-weight: 600;
            color: var(--text-light);
        }
      .skill-level {
            font-size: 0.85em;
            color: var(--text-muted);
        }
      /* Certificações */
        .cert-item {
            background: rgba(16, 185, 129, 0.05);
            border-left: 3px solid var(--primary);
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 4px;
            transition: all 0.3s;
        }
      .cert-item:hover {
            background: rgba(16, 185, 129, 0.1);
            transform: translateX(4px);
        }
      .cert-name {
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 4px;
        }
      .cert-related {
            font-size: 0.85em;
            color: var(--text-muted);
        }
      .cert-tag {
            display: inline-block;
            background: rgba(34, 211, 238, 0.2);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            margin-right: 6px;
            margin-top: 4px;
        }
      /* Idiomas com barras de progresso */
        .language-item {
            margin-bottom: 20px;
        }
      .language-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }
      .language-name {
            font-weight: 600;
            color: var(--text-light);
        }
      .language-level {
            color: var(--text-muted);
            font-size: 0.9em;
        }
      .progress-bar {
            height: 8px;
            background: rgba(16, 185, 129, 0.2);
            border-radius: 4px;
            overflow: hidden;
        }
      .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--primary-light));
            border-radius: 4px;
            transition: width 1s ease;
        }
      /* Projetos */
        .project-card {
            background: rgba(16, 185, 129, 0.05);
            border: 1px solid rgba(16, 185, 129, 0.2);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
            transition: all 0.3s;
        }
      .project-card:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 16px rgba(16, 185, 129, 0.2);
            transform: translateY(-2px);
        }
      .project-title {
            font-size: 1.1em;
            font-weight: 600;
            color: var(--primary-light);
            margin-bottom: 8px;
        }
      .project-desc {
            color: var(--text-muted);
        }
      /* Responsive */
        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }
            
            .header-content {
                flex-direction: column;
                text-align: center;
            }
            
            .header h1 {
                font-size: 1.8em;
            }
            
            .contact-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
