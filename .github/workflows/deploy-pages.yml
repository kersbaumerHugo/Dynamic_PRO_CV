name: Deploy to Pages
on:
  push:
    branches: [ main ]

jobs:
  verify-docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: resume-app:verify-${{ github.run_id }}

      - name: Run container
        run: |
          docker run -d --rm --name resume-verify -p 8080:8080 resume-app:verify-${{ github.run_id }} || (docker logs resume-verify || true)

      - name: Wait for server
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080/ >/dev/null 2>&1; then echo 'up' && break; fi
            sleep 1
          done

      - name: Smoke check index
        run: |
          set -e
          status=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8080/ || true)
          echo "status=$status"
          if [ "$status" != "200" ]; then docker ps -a; docker logs resume-verify || true; exit 1; fi

      - name: Stop container
        run: |
          docker stop resume-verify || true

      - name: Cleanup image
        run: |
          docker rmi resume-app:verify-${{ github.run_id }} || true

  build:
    needs: verify-docker
    runs-on: ubuntu-latest
    outputs:
      dist-path: ${{ steps.upload-artifact.outputs.artifact-path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate and test
        run: npm run verify

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build HTML
        run: npm run build

      - name: Generate PDFs
        run: npm run pdf

      - name: Upload Pages artifact
        id: upload-artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1

      - name: Upload generated PDFs as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pdfs
          path: dist/downloads
